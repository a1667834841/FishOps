name: Agent API 验证
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run regression
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m1-report-${{ matrix.os }}
          path: .test-results/
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: m1-extension-${{ matrix.os }}
          path: apps/extension/dist/
          if-no-files-found: error
