<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自动回复设置</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
      background: #f5f5f5;
    }

    .container {
      background: white;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 24px;
      color: #333;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px solid #00c1de;
    }

    .section {
      margin-bottom: 32px;
    }

    .section-title {
      font-size: 18px;
      color: #333;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      background: #f8f8f8;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .toggle-label {
      font-size: 16px;
      color: #333;
    }

    .toggle-switch {
      position: relative;
      width: 60px;
      height: 34px;
    }

    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #00c1de;
    }

    input:checked + .slider:before {
      transform: translateX(26px);
    }

    .keyword-list {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 16px;
    }

    .keyword-item {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      align-items: center;
    }

    .keyword-item input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .keyword-item input:focus {
      outline: none;
      border-color: #00c1de;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #00c1de;
      color: white;
    }

    .btn-primary:hover {
      background: #00a8b8;
    }

    .btn-danger {
      background: #ff4d4f;
      color: white;
    }

    .btn-danger:hover {
      background: #ff7875;
    }

    .btn-add {
      background: #52c41a;
      color: white;
      width: 100%;
      margin-top: 12px;
    }

    .btn-add:hover {
      background: #73d13d;
    }

    .settings-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .setting-item {
      background: #f8f8f8;
      padding: 16px;
      border-radius: 8px;
    }

    .setting-item label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }

    .setting-item input {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
    }

    .setting-item input:focus {
      outline: none;
      border-color: #00c1de;
    }

    .status-bar {
      background: #e6f7ff;
      border: 1px solid #91d5ff;
      border-radius: 4px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14px;
      color: #0050b3;
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      margin-top: 24px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
    }

    .empty-state p {
      margin-top: 8px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🤖 自动回复设置</h1>

    <div id="statusBar" class="status-bar" style="display: none;">
      <span id="statusText"></span>
    </div>

    <!-- 启用开关 -->
    <div class="section">
      <div class="toggle-container">
        <span class="toggle-label">启用自动回复</span>
        <label class="toggle-switch">
          <input type="checkbox" id="enableToggle">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- 关键字列表 -->
    <div class="section">
      <div class="section-title">
        📝 关键字回复规则
      </div>
      <div class="keyword-list" id="keywordList">
        <!-- 动态生成 -->
      </div>
      <button class="btn btn-add" id="addKeywordBtn">+ 添加新规则</button>
    </div>

    <!-- 其他设置 -->
    <div class="section">
      <div class="section-title">
        ⚙️ 高级设置
      </div>
      <div class="settings-grid">
        <div class="setting-item">
          <label>回复延迟（毫秒）</label>
          <input type="number" id="delayInput" min="0" max="10000" value="1000">
        </div>
        <div class="setting-item">
          <label>冷却时间（秒）</label>
          <input type="number" id="cooldownInput" min="0" max="3600" value="60">
        </div>
      </div>
    </div>

    <!-- 保存按钮 -->
    <button class="btn btn-primary save-btn" id="saveBtn">💾 保存设置</button>
  </div>

  <script src="auto-reply-options.js"></script>
</body>
</html>
