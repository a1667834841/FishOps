<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闲鱼数据采集助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 400px;
      font-family: 'PingFang SC', 'Microsoft YaHei', Arial, sans-serif;
      background: #f5f7fa;
      color: #333;
    }

    /* 主容器 */
    .container {
      background: white;
      padding: 16px;
    }

    /* 顶部标题 */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
    }
    .header .badge {
      font-size: 11px;
      color: #999;
    }

    /* 状态栏 */
    .status-bar {
      height: 32px;
      background: #fafafa;
      border-radius: 4px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 12px;
      font-size: 13px;
      margin-bottom: 8px;
    }
    .status-bar .indicator {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4caf50;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    .status-bar .status-text {
      color: #666;
    }
    .status-bar .status-text span {
      color: #ff9800;
      font-weight: 600;
      margin: 0 4px;
    }

    /* 操作栏 */
    .action-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      height: 40px;
    }

    /* 输入框 */
    .keyword-input {
      flex: 1;
      height: 32px;
      padding: 0 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .keyword-input:focus {
      border-color: #ffe60f;
    }
    .keyword-input::placeholder {
      color: #bbb;
    }

    /* 按钮 */
    .btn {
      height: 32px;
      padding: 0 16px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      background: white;
      color: #666;
      white-space: nowrap;
    }
    .btn:hover {
      border-color: #bbb;
      background: #fafafa;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      border-color: #ffe60f;
      background: linear-gradient(135deg, #ffe60f 0%, #ffed4e 100%);
      color: #333;
      font-weight: 500;
    }
    .btn-primary:hover {
      border-color: #ffd700;
      background: linear-gradient(135deg, #ffd700 0%, #ffe60f 100%);
      box-shadow: 0 2px 8px rgba(255, 230, 15, 0.3);
    }
    .btn-danger {
      border: none;
      background: transparent;
      color: #f44336;
    }
    .btn-danger:hover {
      background: #fff5f5;
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Toast 提示 */
    .toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-100px);
      background: rgba(0, 0, 0, 0.85);
      color: white;
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      z-index: 10000;
      opacity: 0;
      transition: all 0.3s ease;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.success {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    }
    .toast.error {
      background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
    }
    .toast.warning {
      background: linear-gradient(135deg, #ff9800 0%, #ff5722 100%);
    }

    /* 确认对话框 */
    .confirm-dialog {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10001;
    }
    .confirm-dialog.show {
      display: flex;
    }
    .confirm-content {
      background: white;
      border-radius: 8px;
      padding: 20px;
      width: 280px;
    }
    .confirm-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 10px;
    }
    .confirm-message {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
      line-height: 1.6;
    }
    .confirm-buttons {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .confirm-btn {
      padding: 6px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
      background: white;
    }
    .confirm-btn-cancel {
      color: #666;
    }
    .confirm-btn-confirm {
      background: #f44336;
      color: white;
      border-color: #f44336;
    }

    /* 爬取进行中状态 */
    .btn-primary.crawling {
      background: linear-gradient(135deg, #e64646 0%, #f06969 100%);
      border-color: #e64646;
      color: white;
    }
    .btn-primary.crawling:hover {
      background: linear-gradient(135deg, #d63636 0%, #e05959 100%);
    }

    /* 流量词列表 */
    .suggest-words-list {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      overflow: hidden;
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }
    .suggest-words-list:hover {
      background: #f5f5f5;
    }
    .suggest-word-tag {
      padding: 4px 10px;
      background: #fff8e1;
      border: 1px solid #ffe60f;
      border-radius: 4px;
      font-size: 12px;
      color: #333;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
    }
    .suggest-word-more {
      padding: 4px 10px;
      background: #f5f5f5;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 12px;
      color: #999;
      white-space: nowrap;
      user-select: none;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <h1>🐟 闲鱼数据采集</h1>
      <span class="badge">v1.7.0</span>
    </div>

    <!-- 状态栏 -->
    <div class="status-bar">
      <span class="indicator"></span>
      <span class="status-text">
        运行中 · 已采 <span id="itemCount">0</span> 件 · 第 <span id="pageCount">0</span> 页
      </span>
    </div>

    <!-- 操作栏 - 第一行 -->
    <div class="action-bar">
      <input type="text" class="keyword-input" id="keywordInput" placeholder="输入关键词...">
      <button class="btn btn-primary" id="startCrawl">开始</button>
    </div>

    <!-- 操作栏 - 第二行 -->
    <div class="action-bar">
      <button class="btn" id="openConfig">配置</button>
      <button class="btn" id="tableManage">表格管理</button>
      <button class="btn" id="exportCSV">导出</button>
      <button class="btn" id="sendFeishu">飞书</button>
      <button class="btn btn-danger" id="clearData">清空</button>
    </div>

    <!-- 流量词展示区域 -->
    <div id="suggestWordsContainer" style="display: none; margin-top: 12px;">
      <div style="font-size: 12px; color: #999; margin-bottom: 6px;">流量词（点击复制全部）</div>
      <div id="suggestWordsList" class="suggest-words-list" title="点击复制所有流量词"></div>
      <div id="suggestWordsHidden" style="display: none;"></div>
    </div>

    <!-- 飞书状态 -->
    <div id="feishuStatus" style="display: none; margin-top: 8px; padding: 8px 12px; background: #f0f9ff; border-radius: 4px; font-size: 12px; color: #1976d2;">
      <span style="display: flex; align-items: center; gap: 6px;">
        <span style="font-size: 14px;">📊</span>
        <span id="feishuStatusText">正在发送到飞书...</span>
      </span>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <!-- 确认对话框 -->
  <div id="confirmDialog" class="confirm-dialog">
    <div class="confirm-content">
      <div class="confirm-title" id="confirmTitle">确认操作</div>
      <div class="confirm-message" id="confirmMessage"></div>
      <div class="confirm-buttons">
        <button class="confirm-btn confirm-btn-cancel" id="confirmCancel">取消</button>
        <button class="confirm-btn confirm-btn-confirm" id="confirmOk">确定</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
