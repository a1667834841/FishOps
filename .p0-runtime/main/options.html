<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>配置中心 - 闲鱼数据采集</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'PingFang SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f4f5f7;
      color: #1a1a1a;
      font-size: 13px;
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      padding: 32px 16px;
      min-height: 100vh;
    }

    .app {
      display: flex;
      width: 720px;
      max-width: 100%;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(15,23,42,.05), 0 12px 32px rgba(15,23,42,.08);
      overflow: hidden;
      min-height: 460px;
    }

    /* ===== 侧边栏 ===== */
    .sidebar {
      width: 180px;
      background: #fafbfc;
      border-right: 1px solid #eef0f3;
      padding: 20px 0;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 0 16px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #1a1a1a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header svg {
      color: #1a1a1a;
      flex-shrink: 0;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      font-size: 13px;
      color: #6b7280;
      cursor: pointer;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: inherit;
      transition: all .15s;
      border-left: 3px solid transparent;
      position: relative;
    }

    .nav-item:hover {
      background: #f0f1f4;
      color: #1a1a1a;
    }

    .nav-item.active {
      background: #fffdf2;
      color: #1a1a1a;
      font-weight: 600;
      border-left-color: #ffe60f;
    }

    .nav-item svg {
      flex-shrink: 0;
      opacity: .6;
    }

    .nav-item.active svg {
      opacity: 1;
      color: #b8860b;
    }

    .nav-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 8px;
      background: #f0f1f4;
      color: #9aa0a6;
      margin-left: auto;
    }

    .nav-item.active .nav-badge {
      background: #fff8e1;
      color: #b8860b;
    }

    /* ===== 主内容区 ===== */
    .main {
      flex: 1;
      padding: 24px 28px;
      overflow-y: auto;
    }

    .panel {
      display: none;
    }

    .panel.active {
      display: block;
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }

    .panel-subtitle {
      font-size: 12px;
      color: #9aa0a6;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .panel-subtitle .optional {
      color: #b8860b;
      font-weight: 500;
      background: #fff8e1;
      padding: 1px 6px;
      border-radius: 6px;
      font-size: 10px;
      margin-left: 6px;
      vertical-align: middle;
    }

    /* ===== 表单组 ===== */
    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .form-group input[type="text"],
    .form-group input[type="number"] {
      width: 100%;
      padding: 8px 11px;
      border: 1px solid #eef0f3;
      border-radius: 9px;
      font-size: 13px;
      font-family: inherit;
      color: #1a1a1a;
      background: #fafbfc;
      transition: border-color .15s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #ffe60f;
      background: #ffffff;
    }

    .form-group input::placeholder {
      color: #c2c6cc;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    .form-hint {
      font-size: 11px;
      color: #c2c6cc;
      margin-top: 3px;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #1a1a1a;
      cursor: pointer;
    }

    .form-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #ffe60f;
    }

    .form-section {
      border-top: 1px solid #eef0f3;
      padding-top: 16px;
      margin-top: 16px;
    }

    .form-section-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    /* ===== 操作栏 ===== */
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #eef0f3;
    }

    .btn {
      font-family: inherit;
      cursor: pointer;
      border: none;
      border-radius: 9px;
      font-size: 13px;
      padding: 0 20px;
      height: 36px;
      white-space: nowrap;
      transition: all .15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 600;
    }

    .btn-primary {
      background: linear-gradient(135deg, #ffe60f, #ffd000);
      color: #1a1a1a;
      box-shadow: 0 2px 6px rgba(255,210,0,.4);
    }

    .btn-primary:hover {
      box-shadow: 0 4px 12px rgba(255,210,0,.5);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: #ffffff;
      border: 1px solid #eef0f3;
      color: #6b7280;
      font-weight: 500;
    }

    .btn-ghost:hover {
      background: #f5f6f8;
      border-color: #d0d3d8;
    }

    .btn-test {
      background: #ffffff;
      border: 1px solid #ffe60f;
      color: #b8860b;
      font-weight: 500;
      font-size: 12px;
      padding: 0 14px;
      height: 32px;
    }

    .btn-test:hover {
      background: #fffdf2;
    }

    .test-result {
      font-size: 12px;
      margin-top: 8px;
      min-height: 18px;
    }

    /* ===== 空占位面板 ===== */
    .empty-placeholder {
      text-align: center;
      padding: 40px 20px;
      color: #c2c6cc;
      font-size: 13px;
    }

    .empty-placeholder svg {
      opacity: .3;
      margin-bottom: 12px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f1f1f;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 9px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      white-space: nowrap;
      transition: all .25s ease;
      box-shadow: 0 4px 16px rgba(0,0,0,.15);
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast.error { background: #ffebee; color: #c62828; }
    .toast.success { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>

<!-- 内联 SVG 图标 -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-fish" viewBox="0 0 24 24">
      <path d="M6.5 12c0-2.2 2.5-4 5.5-4s5.5 1.8 5.5 4-2.5 4-5.5 4-5.5-1.8-5.5-4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M17.5 12l3.5-2.5v5L17.5 12z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="9" cy="11" r=".6" fill="currentColor"/>
    </symbol>
    <symbol id="i-gear" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="M22 2L11 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M22 2l-7 20-4-9-9-4 20-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    </symbol>
    <symbol id="i-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M21 21l-4.3-4.3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-download" viewBox="0 0 24 24">
      <path d="M12 3v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="i-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1.6" fill="currentColor"/>
      <circle cx="12" cy="12" r="1.6" fill="currentColor"/>
      <circle cx="19" cy="12" r="1.6" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="app">

  <!-- 侧边栏 -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <svg width="18" height="18"><use href="#i-fish"/></svg>
      闲鱼数据采集
    </div>

    <button class="nav-item active" data-panel="crawl">
      <svg width="14" height="14"><use href="#i-search"/></svg>
      爬取设置
    </button>

    <button class="nav-item" data-panel="proxy">
      <svg width="14" height="14"><use href="#i-gear"/></svg>
      代理设置
      <span class="nav-badge">暂无</span>
    </button>

    <button class="nav-item" data-panel="advanced">
      <svg width="14" height="14"><use href="#i-gear"/></svg>
      高级设置
      <span class="nav-badge">暂无</span>
    </button>

    <button class="nav-item" data-panel="feishu">
      <svg width="14" height="14"><use href="#i-send"/></svg>
      飞书同步
      <span class="nav-badge">可选</span>
    </button>
  </nav>

  <!-- 主内容区 -->
  <div class="main">

    <!-- 爬取设置 -->
    <div id="panel-crawl" class="panel active">
      <div class="panel-title">爬取设置</div>
      <div class="panel-subtitle">配置闲鱼商品批量采集参数</div>

      <div class="form-row">
        <div class="form-group">
          <label>起始页码</label>
          <input type="number" id="startPageInput" min="1" max="100" value="1">
          <div class="form-hint">从第几页开始采集</div>
        </div>
        <div class="form-group">
          <label>采集页数</label>
          <input type="number" id="pageCountInput" min="1" max="50" value="3">
          <div class="form-hint">每次采集多少页</div>
        </div>
        <div class="form-group">
          <label>间隔时间（毫秒）</label>
          <input type="number" id="delayInput" min="500" max="10000" value="1500">
          <div class="form-hint">每页采集间隔</div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">过滤条件</div>
        <div class="form-row">
          <div class="form-group">
            <label>最小想要数</label>
            <input type="number" id="minWantCntInput" min="0" value="0">
          </div>
          <div class="form-group">
            <label>最小价格</label>
            <input type="number" id="minPriceInput" min="0" step="0.01" value="0">
          </div>
          <div class="form-group">
            <label>最大价格（0=不限）</label>
            <input type="number" id="maxPriceInput" min="0" step="0.01" value="0">
          </div>
        </div>
        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="onlyFreeShipInput">
            只看包邮
          </label>
        </div>
      </div>

      <div class="actions">
        <button id="saveBtn" class="btn btn-primary">保存配置</button>
        <button id="resetBtn" class="btn btn-ghost">恢复默认</button>
      </div>
    </div>

    <!-- 代理设置 -->
    <div id="panel-proxy" class="panel">
      <div class="panel-title">代理设置</div>
      <div class="empty-placeholder">
        <svg width="32" height="32"><use href="#i-gear"/></svg>
        <div>暂无代理配置</div>
      </div>
    </div>

    <!-- 高级设置 -->
    <div id="panel-advanced" class="panel">
      <div class="panel-title">高级设置</div>
      <div class="empty-placeholder">
        <svg width="32" height="32"><use href="#i-gear"/></svg>
        <div>暂无高级配置</div>
      </div>
    </div>

    <!-- 飞书同步 -->
    <div id="panel-feishu" class="panel">
      <div class="panel-title">飞书同步 <span class="optional">可选</span></div>
      <div class="panel-subtitle">CSV 为主输出，飞书同步为可选功能</div>

      <div class="form-row">
        <div class="form-group">
          <label>App ID</label>
          <input type="text" id="feishuAppId" placeholder="输入飞书 App ID">
        </div>
        <div class="form-group">
          <label>App Secret</label>
          <input type="text" id="feishuAppSecret" placeholder="输入飞书 App Secret">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>表格 Token</label>
          <input type="text" id="feishuSpreadsheetToken" placeholder="电子表格 token">
        </div>
        <div class="form-group">
          <label>商品表 ID</label>
          <input type="text" id="feishuProductTableId" placeholder="商品数据表 ID">
        </div>
        <div class="form-group">
          <label>商家表 ID</label>
          <input type="text" id="feishuSellerTableId" placeholder="商家数据表 ID">
        </div>
      </div>

      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" id="feishuEnabled">
          启用飞书同步
        </label>
      </div>

      <div style="display:flex; gap:8px; align-items:center;">
        <button id="testFeishuBtn" class="btn btn-test">测试连接</button>
        <span id="feishuTestResult" class="test-result"></span>
      </div>

      <div class="actions">
        <button id="saveBtn2" class="btn btn-primary" onclick="document.getElementById('saveBtn').click()">保存配置</button>
        <button id="resetBtn2" class="btn btn-ghost" onclick="document.getElementById('resetBtn').click()">恢复默认</button>
      </div>
    </div>

  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="options.js"></script>
</body>
</html>
