<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>闲鱼聊天监听助手</title>
  <style>
    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    h1 {
      font-size: 16px;
      margin-bottom: 10px;
      color: #333;
    }
    .status {
      padding: 10px;
      margin: 15px 0;
      border-radius: 4px;
      background-color: #f0f0f0;
      font-size: 14px;
    }
    .status.active {
      background-color: #e6f4ea;
      color: #1e7e34;
    }
    .status.inactive {
      background-color: #fce8e6;
      color: #c5221f;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 4px;
      background-color: #1a73e8;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #1557b0;
    }
    button.secondary {
      background-color: #f0f0f0;
      color: #333;
    }
    button.secondary:hover {
      background-color: #e0e0e0;
    }
    .info {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #e0e0e0;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>🐟 闲鱼聊天监听助手</h1>
  
  <div id="status" class="status inactive">
    状态：检查中...
  </div>
  
  <button id="openOptions">⚙️ 打开设置页面</button>
  
  <div class="info">
    <div id="version">版本：2.0.0</div>
    <div id="pageInfo">请在闲鱼聊天页面使用</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
